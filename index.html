<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>GoLogotype: free logotype generator with true vector SVG output</title>
    <meta
      name="description"
      content="Design a logotype and download real vector files: lockups, symbol, app icon and favicons in SVG and PNG, plus brand guidelines. Letters are outlined, so no font is needed to use them."
    />
    <meta name="author" content="Glauser Creative" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://gologotype.com" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="GoLogotype: free logotype generator" />
    <meta
      property="og:description"
      content="Design a logotype and download real vector files, plus brand guidelines. What you see on screen is exactly what you download."
    />
    <meta property="og:url" content="https://gologotype.com" />
    <meta property="og:site_name" content="GoLogotype" />
    <meta property="og:image" content="https://gologotype.com/gologotype_facebook_share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GoLogotype: logotype generator with true vector SVG output" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GoLogotype: free logotype generator" />
    <meta
      name="twitter:description"
      content="Design a logotype and download real vector files, plus brand guidelines."
    />
    <meta name="twitter:image" content="https://gologotype.com/gologotype_facebook_share.png" />
    <meta name="twitter:creator" content="@glausercreative" />
    <meta name="twitter:site" content="@glausercreative" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Only the interface font is loaded up front. Logo typefaces are fetched on
      demand as TrueType through /api/font, which is the same file the renderer
      turns into outlines — so the preview can never show a weight the export
      does not use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GoLogotype",
        "url": "https://gologotype.com",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "Free logotype generator that outputs true vector SVG and PNG brand assets with outlined letterforms, plus brand guidelines.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "True vector SVG with outlined letterforms",
          "Curated Google Fonts with per-typeface tracking",
          "Designed symbol archetypes aligned to cap height",
          "Light and dark logo variants",
          "App icons and favicons",
          "Brand guidelines with clear space and minimum size",
          "Trademark symbols set to typographic rules"
        ],
        "author": { "@type": "Organization", "name": "Glauser Creative", "url": "https://glauser.com" }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "How to make a logotype",
        "step": [
          { "@type": "HowToStep", "name": "Pick a style", "text": "Choose a preset to set the typeface, weight and tracking, or use Surprise me." },
          { "@type": "HowToStep", "name": "Enter your brand name", "text": "Type the name; it is set as outlines with the typeface's own kerning." },
          { "@type": "HowToStep", "name": "Choose a symbol", "text": "Pick a mark from the grid, or leave it as a wordmark only." },
          { "@type": "HowToStep", "name": "Set the colour", "text": "Pick a brand colour and check contrast on light and dark." },
          { "@type": "HowToStep", "name": "Download", "text": "Download the brand package of SVG and PNG files plus guidelines." }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
